version: '3.8'

services:
  vocab-video-saas:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vocab-video-pipeline
    ports:
      - "3980:3990"
      - "3990:3990"
    environment:
      - PORT=3990
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - ./renders:/app/renders
      - ./downloads:/app/downloads
      - ./scripts:/app/scripts
    restart: unless-stopped
